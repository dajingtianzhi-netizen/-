<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理戦ゲーム：無欲の銀貨</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent-gold: #ffd700;
            --accent-silver: #c0c0c0;
            --text-color: #ffffff;
            --border-color: #444;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h1 {
            text-align: center;
            color: var(--accent-gold);
            margin-top: 0;
            font-size: 1.8rem;
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 10px;
        }

        .status-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            background: #222;
            padding: 15px;
            border-radius: 8px;
        }

        .player-status {
            padding: 10px;
            border-radius: 6px;
            background: #333;
            text-align: center;
        }

        .player-status h3 { margin: 0 0 10px 0; font-size: 1.1rem; }
        .stat-val { font-size: 1.2rem; font-weight: bold; }
        .silver { color: var(--accent-silver); }
        .gold { color: var(--accent-gold); }

        .log-area {
            height: 200px;
            background: #111;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .log-entry { margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 4px; }
        .log-alert { color: var(--accent-gold); font-weight: bold; }

        .control-panel {
            background: #222;
            padding: 15px;
            border-radius: 8px;
        }

        label { display: block; margin-bottom: 8px; font-weight: bold; }
        
        select, input[type="number"], button {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #333;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            background: #d4af37;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        button:hover { background: #ffd700; }
        button:disabled { background: #555; cursor: not-allowed; }

        .card-desc {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: -8px;
            margin-bottom: 12px;
        }

        .hidden { display: none; }

        .mask-screen {
            text-align: center;
            padding: 30px;
            background: #111;
            border-radius: 8px;
            border: 2px dashed var(--accent-gold);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>心理戦ゲーム：無欲の銀貨</h1>

    <!-- 1. ゲーム準備画面 -->
    <div id="setup-screen">
        <label>対戦モード:</label>
        <select id="game-mode-select" onchange="toggleSetupUI()">
            <option value="vs-ai">1人プレイ (VS AI)</option>
            <option value="pvp">2人対戦 (1端末交代プレイ)</option>
        </select>

        <label>配分ルール:</label>
        <select id="card-mode-select" onchange="toggleSetupUI()">
            <option value="1">全所持型（一覧からカードを選択）</option>
            <option value="2">ランダム配布型（ランダムで1枚配布）</option>
        </select>

        <div id="p1-card-group">
            <label id="p1-card-label">プレイヤー1 持参カード:</label>
            <select id="p1-initial-card"></select>
            <div id="p1-card-desc" class="card-desc"></div>
        </div>

        <div id="p2-card-group">
            <label>プレイヤー2 持参カード:</label>
            <select id="p2-initial-card"></select>
            <div id="p2-card-desc" class="card-desc"></div>
        </div>

        <button onclick="startGame()">ゲーム開始</button>
    </div>

    <!-- 2. ゲーム画面 -->
    <div id="game-screen" class="hidden">
        <div class="status-board">
            <div class="player-status">
                <h3 id="p1-name-display">あなた</h3>
                <div>銀貨: <span id="p1-silver" class="stat-val silver">50</span>枚</div>
                <div>金貨: <span id="p1-gold" class="stat-val gold">0</span>枚</div>
            </div>
            <div class="player-status">
                <h3 id="p2-name-display">AI</h3>
                <div>銀貨: <span id="p2-silver" class="stat-val silver">50</span>枚</div>
                <div>金貨: <span id="p2-gold" class="stat-val gold">0</span>枚</div>
            </div>
        </div>

        <div id="round-title" style="text-align: center; font-weight: bold; margin-bottom: 10px; color: var(--accent-gold);">
            【第 1 / 5 ラウンド】
        </div>

        <div class="log-area" id="game-log"></div>

        <!-- 入力パネル -->
        <div class="control-panel" id="action-panel">
            <div id="turn-indicator" style="font-weight:bold; color:var(--accent-gold); margin-bottom:10px;"></div>

            <label id="silver-input-label">提示する銀貨枚数:</label>
            <input type="number" id="silver-choice" min="1" max="46" value="10">

            <label>役職カードの使用:</label>
            <select id="card-use-select">
                <option value="0">使用しない</option>
                <option value="1">使用する</option>
            </select>
            <div id="my-card-info" class="card-desc"></div>

            <button id="submit-btn" onclick="handleInputSubmit()">決定</button>
        </div>

        <!-- 交代用隠し画面 -->
        <div id="mask-panel" class="mask-screen hidden">
            <h3 id="mask-title">プレイヤー1の入力完了</h3>
            <p>相手に画面を見られないように端末を渡してください。</p>
            <button onclick="proceedToP2Turn()">プレイヤー2のターンを開始</button>
        </div>

        <button id="restart-btn" class="hidden" onclick="resetGame()">もう一度遊ぶ</button>
    </div>
</div>

<script>
const ROLES = {
    1: { name: "博徒", desc: "前Rで7の倍数を提示していれば勝利時金貨2倍(第1R不可)" },
    2: { name: "暗殺者", desc: "相手の役職を無効化し金貨10枚獲得" },
    3: { name: "王", desc: "このラウンドでは、自分が提示した銀貨の枚数よりも5枚差し引いて勝敗が判断される" },
    4: { name: "騎士", desc: "相手の銀貨を10枚増やす(第1〜4R専用)" },
    5: { name: "商人", desc: "勝利時金貨2倍。敗北時相手に金貨5枚進呈" },
    6: { name: "魔術師", desc: "敗北時、相手の獲得金貨枚数を5枚に固定する" },
    7: { name: "農民", desc: "勝利時、獲得金貨が相手の提示した銀貨の枚数になる" }
};

let gameMode = "vs-ai";
let currentRound = 1;
let p1Silver = 50, p2Silver = 50;
let p1Gold = 0, p2Gold = 0;
let p1PrevChoice = 0, p2PrevChoice = 0;
let p1Card = null, p2Card = null;
let p1UsedCard = false, p2UsedCard = false;

// ターン一時保存（PvP用）
let p1ChoiceTemp = 0, p1RoleTemp = null;
let currentTurnPlayer = 1;

window.onload = function() {
    setupCardDropdowns();
    toggleSetupUI();
};

function setupCardDropdowns() {
    ['p1-initial-card', 'p2-initial-card'].forEach(id => {
        const select = document.getElementById(id);
        select.innerHTML = '';
        for (let rId in ROLES) {
            let opt = document.createElement('option');
            opt.value = rId;
            opt.textContent = ROLES[rId].name;
            select.appendChild(opt);
        }
    });
    document.getElementById('p1-initial-card').onchange = () => updateCardDesc('p1');
    document.getElementById('p2-initial-card').onchange = () => updateCardDesc('p2');
    updateCardDesc('p1');
    updateCardDesc('p2');
}

function updateCardDesc(player) {
    const id = document.getElementById(`${player}-initial-card`).value;
    document.getElementById(`${player}-card-desc`).textContent = ROLES[id].desc;
}

function toggleSetupUI() {
    gameMode = document.getElementById('game-mode-select').value;
    const cardMode = document.getElementById('card-mode-select').value;
    
    document.getElementById('p1-card-group').style.display = (cardMode === "1") ? "block" : "none";
    document.getElementById('p2-card-group').style.display = (cardMode === "1" && gameMode === "pvp") ? "block" : "none";
    document.getElementById('p1-card-label').textContent = (gameMode === "pvp") ? "プレイヤー1 持参カード:" : "持参する役職カードを選択:";
}

function log(msg, isAlert = false) {
    const logArea = document.getElementById('game-log');
    const div = document.createElement('div');
    div.className = isAlert ? "log-entry log-alert" : "log-entry";
    div.innerHTML = msg;
    logArea.appendChild(div);
    logArea.scrollTop = logArea.scrollHeight;
}

function startGame() {
    const cardMode = document.getElementById('card-mode-select').value;
    
    if (cardMode === "1") {
        p1Card = parseInt(document.getElementById('p1-initial-card').value);
        p2Card = (gameMode === "pvp") ? parseInt(document.getElementById('p2-initial-card').value) : Math.floor(Math.random() * 7) + 1;
    } else {
        p1Card = Math.floor(Math.random() * 7) + 1;
        p2Card = Math.floor(Math.random() * 7) + 1;
    }

    document.getElementById('p1-name-display').textContent = (gameMode === "pvp") ? "プレイヤー1" : "あなた";
    document.getElementById('p2-name-display').textContent = (gameMode === "pvp") ? "プレイヤー2" : "AI";

    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');

    log(`ゲーム開始！`, true);
    if (gameMode !== "pvp") {
        log(`あなたの役職: 【${ROLES[p1Card].name}】`);
    }

    startRoundTurn(1);
}

function startRoundTurn(playerNum) {
    currentTurnPlayer = playerNum;
    document.getElementById('mask-panel').classList.add('hidden');
    document.getElementById('action-panel').classList.remove('hidden');

    const pName = (gameMode === "pvp") ? `プレイヤー${playerNum}` : "あなた";
    document.getElementById('turn-indicator').textContent = (gameMode === "pvp") ? `【${pName}の入力ターン】` : "";

    const currentSilver = (playerNum === 1) ? p1Silver : p2Silver;
    const currentCard = (playerNum === 1) ? p1Card : p2Card;
    const currentUsed = (playerNum === 1) ? p1UsedCard : p2UsedCard;

    const remR = 6 - currentRound;
    const minP = 1;
    const maxP = (remR === 1) ? currentSilver : currentSilver - (remR - 1);

    const silverInput = document.getElementById('silver-choice');
    silverInput.min = minP;
    silverInput.max = maxP;
    silverInput.value = Math.min(Math.max(10, minP), maxP);

    if (remR === 1) {
        silverInput.value = currentSilver;
        silverInput.disabled = true;
        document.getElementById('silver-input-label').textContent = `最終Rのため全額（${currentSilver}枚）投入:`;
    } else {
        silverInput.disabled = false;
        document.getElementById('silver-input-label').textContent = `${pName} の提示銀貨枚数:`;
    }

    const cardSelect = document.getElementById('card-use-select');
    const cardInfo = document.getElementById('my-card-info');

    if (currentUsed) {
        cardSelect.disabled = true;
        cardSelect.value = "0";
        cardInfo.textContent = "※役職カードは使用済みです";
    } else {
        let usable = true;
        let reason = "";
        if (currentCard === 1 && currentRound === 1) { usable = false; reason = "第1R使用不可"; }
        else if (currentCard === 4 && currentRound === 5) { usable = false; reason = "第5R使用不可"; }

        cardSelect.disabled = !usable;
        cardSelect.value = "0";
        cardInfo.textContent = `【${ROLES[currentCard].name}】 (${ROLES[currentCard].desc}) ${usable ? '' : ' ⚠️' + reason}`;
    }
}

function handleInputSubmit() {
    const remR = 6 - currentRound;
    const currentSilver = (currentTurnPlayer === 1) ? p1Silver : p2Silver;
    const minP = 1;
    const maxP = (remR === 1) ? currentSilver : currentSilver - (remR - 1);

    let choice = parseInt(document.getElementById('silver-choice').value);
    if (isNaN(choice) || choice < minP || choice > maxP) {
        alert(`${minP}〜${maxP}枚の範囲で入力してください。`);
        return;
    }

    let role = null;
    const currentUsed = (currentTurnPlayer === 1) ? p1UsedCard : p2UsedCard;
    const currentCard = (currentTurnPlayer === 1) ? p1Card : p2Card;

    if (!currentUsed && document.getElementById('card-use-select').value === "1") {
        role = currentCard;
        if (currentTurnPlayer === 1) p1UsedCard = true;
        else p2UsedCard = true;
    }

    if (gameMode === "pvp" && currentTurnPlayer === 1) {
        p1ChoiceTemp = choice;
        p1RoleTemp = role;

        document.getElementById('action-panel').classList.add('hidden');
        document.getElementById('mask-panel').classList.remove('hidden');
    } else {
        let p2Choice = choice;
        let p2Role = role;

        if (gameMode === "vs-ai") {
            const aiData = calculateAIChoice(remR);
            p2Choice = aiData.choice;
            p2Role = aiData.role;
        } else {
            p1Choice = p1ChoiceTemp;
            p1Role = p1RoleTemp;
        }

        const p1ChoiceFinal = (gameMode === "pvp") ? p1ChoiceTemp : choice;
        const p1RoleFinal = (gameMode === "pvp") ? p1RoleTemp : role;

        executeRound(p1ChoiceFinal, p1RoleFinal, p2Choice, p2Role);
    }
}

function proceedToP2Turn() {
    startRoundTurn(2);
}

function calculateAIChoice(remR) {
    let choice = 0;
    if (remR === 1) choice = p2Silver;
    else {
        const minAi = 1;
        const maxAi = p2Silver - (remR - 1);
        const avg = p2Silver / remR;
        choice = Math.floor(Math.random() * (Math.min(maxAi, Math.floor(avg+2)) - Math.max(minAi, Math.floor(avg-2)) + 1)) + Math.max(minAi, Math.floor(avg-2));
    }

    let role = null;
    if (!p2UsedCard) {
        let usable = true;
        if (p2Card === 1 && currentRound === 1) usable = false;
        else if (p2Card === 4 && currentRound === 5) usable = false;

        if (usable) {
            let shouldUse = false;
            if (p2Card === 1 && p2PrevChoice % 7 === 0 && p2PrevChoice > 0) shouldUse = true;
            else if (p2Card === 3 && currentRound >= 2 && Math.random() < 0.5) shouldUse = true;
            else if (p2Card === 4 && currentRound <= 3 && Math.random() < 0.6) shouldUse = true;
            else if (p2Card === 5 && currentRound >= 2 && Math.random() < 0.4) shouldUse = true;
            else if (p2Card === 6 && currentRound >= 2 && Math.random() < 0.5) shouldUse = true; // 魔術師：負けそうなラウンドで使用
            else if (p2Card === 7 && (choice <= 8 || Math.random() < 0.4)) shouldUse = true;
            else if (p2Card === 2 && currentRound >= 2 && Math.random() < 0.5) shouldUse = true;

            if (currentRound === 5 && usable) shouldUse = true;

            if (shouldUse) {
                role = p2Card;
                p2UsedCard = true;
            }
        }
    }
    return { choice, role };
}

function executeRound(p1Choice, p1Role, p2Choice, p2Role) {
    const p1Name = (gameMode === "pvp") ? "プレイヤー1" : "あなた";
    const p2Name = (gameMode === "pvp") ? "プレイヤー2" : "AI";

    log(`--- 第 ${currentRound} ラウンド ---`);
    log(`${p1Name}: 銀貨${p1Choice}枚 [${p1Role ? ROLES[p1Role].name : 'カードなし'}]`);
    log(`${p2Name}: 銀貨${p2Choice}枚 [${p2Role ? ROLES[p2Role].name : 'カードなし'}]`);

    // 暗殺者判定
    if (p1Role === 2 && p2Role) {
        log(`🗡️【${p1Name}の暗殺者発動！】 相手の役職を無効化し金貨10枚獲得！`, true);
        p1Gold += 10;
        p2Role = null;
    }
    if (p2Role === 2 && p1Role) {
        log(`🗡️【${p2Name}の暗殺者発動！】 相手の役職を無効化し金貨10枚獲得！`, true);
        p2Gold += 10;
        p1Role = null;
    }

    // 勝敗判定用の実質銀貨数を計算
    let p1EffChoice = (p1Role === 3) ? p1Choice - 5 : p1Choice;
    let p2EffChoice = (p2Role === 3) ? p2Choice - 5 : p2Choice;

    if (p1Role === 3) log(`👑【王の効果！】 ${p1Name}の提示銀貨が判定時のみ-5枚（判定: ${p1EffChoice}枚）として扱われます！`, true);
    if (p2Role === 3) log(`👑【王の効果！】 ${p2Name}の提示銀貨が判定時のみ-5枚（判定: ${p2EffChoice}枚）として扱われます！`, true);

    // 少ない方が勝利
    let p1Win = p1EffChoice < p2EffChoice;
    let p2Win = p2EffChoice < p1EffChoice;

    // 得点計算
    if (p1Win) {
        let gain = (p1Role === 7) ? p2Choice : p1Choice;
        if (p1Role === 7) log(`🌾【農民成功！】 相手の銀貨枚数（${p2Choice}枚）を獲得！`);
        if (p1Role === 1 && p1PrevChoice % 7 === 0 && p1PrevChoice > 0) { gain *= 2; log(`🎲【博徒成功！】 金貨2倍！`); }
        if (p1Role === 5) { gain *= 2; log(`💰【商人成功！】 金貨2倍！`); }
        if (p2Role === 6) { gain = 5; log(`🧙‍♂️【相手の魔術師！】 獲得金貨が5枚に固定されました。`); }

        p1Gold += gain;
        log(`✨【${p1Name}の勝利！】 金貨 ${gain}枚 獲得！`, true);
    } else if (p2Win) {
        let gain = (p2Role === 7) ? p1Choice : p2Choice;
        if (p2Role === 7) log(`🌾【農民成功！】 あなたの銀貨枚数（${p1Choice}枚）を獲得！`);
        if (p2Role === 1 && p2PrevChoice % 7 === 0 && p2PrevChoice > 0) { gain *= 2; log(`🎲【博徒成功！】 金貨2倍！`); }
        if (p2Role === 5) { gain *= 2; log(`💰【商人成功！】 金貨2倍！`); }
        if (p1Role === 6) { gain = 5; log(`🧙‍♂️【魔術師発動！】 相手の獲得金貨を5枚に固定！`); }

        p2Gold += gain;
        if (p1Role === 5) { p2Gold += 5; log(`⚠️【商人のリスク】 敗北したため相手に金貨5枚が進呈されました。`); }

        log(`✨【${p2Name}の勝利！】 金貨 ${gain}枚 獲得！`, true);
    } else {
        log(`⚔️【引き分け！】 金貨獲得なし。`);
    }

    p1Silver -= p1Choice;
    p2Silver -= p2Choice;

    if (p1Role === 4) { p2Silver += 10; log(`⚔️【騎士発動！】 相手の銀貨が10枚増えた！`); }
    if (p2Role === 4) { p1Silver += 10; log(`⚔️【騎士発動！】 相手の銀貨が10枚増えた！`); }

    p1PrevChoice = p1Choice;
    p2PrevChoice = p2Choice;

    updateUI();

    if (currentRound === 5) {
        endGame();
    } else {
        currentRound++;
        document.getElementById('round-title').textContent = `【第 ${currentRound} / 5 ラウンド】`;
        startRoundTurn(1);
    }
}

function updateUI() {
    document.getElementById('p1-silver').textContent = p1Silver;
    document.getElementById('p2-silver').textContent = p2Silver;
    document.getElementById('p1-gold').textContent = p1Gold;
    document.getElementById('p2-gold').textContent = p2Gold;
}

function endGame() {
    document.getElementById('action-panel').classList.add('hidden');
    document.getElementById('mask-panel').classList.add('hidden');
    document.getElementById('restart-btn').classList.remove('hidden');

    const p1Name = (gameMode === "pvp") ? "プレイヤー1" : "あなた";
    const p2Name = (gameMode === "pvp") ? "プレイヤー2" : "AI";

    log(`====================`, true);
    log(`      最終結果      `, true);
    log(`====================`, true);
    log(`${p1Name}: 金貨 ${p1Gold} 枚  vs  ${p2Name}: 金貨 ${p2Gold} 枚`);

    if (p1Gold > p2Gold) log(`🏆 おめでとうございます！ ${p1Name} の勝利です！`, true);
    else if (p2Gold > p1Gold) log(`🏆 おめでとうございます！ ${p2Name} の勝利です！`, true);
    else log(`🤝 見事な勝負！引き分けです！`, true);
}

function resetGame() {
    currentRound = 1;
    p1Silver = 50; p2Silver = 50;
    p1Gold = 0; p2Gold = 0;
    p1PrevChoice = 0; p2PrevChoice = 0;
    p1UsedCard = false; p2UsedCard = false;

    document.getElementById('game-log').innerHTML = '';
    document.getElementById('action-panel').classList.remove('hidden');
    document.getElementById('restart-btn').classList.add('hidden');
    document.getElementById('setup-screen').classList.remove('hidden');
    document.getElementById('game-screen').classList.add('hidden');
}
</script>
</body>
</html>
